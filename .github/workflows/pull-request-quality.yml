name: Application quality gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: application-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Application quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:9/invalid?connect_timeout=1
      JWT_SECRET: ci-only-non-production-secret-0000000000000000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hiroma_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: hiroma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiroma_test -d hiroma_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run complete test suite
        env:
          DATABASE_URL: postgresql://hiroma_test:ci-test-only@127.0.0.1:5432/hiroma_test
        run: npm run test:all

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Run deterministic 5,000-member binary stress simulation
        run: npm run simulate:binary-5000 > binary-5000-simulation.json

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build production application without external credentials
        run: npm run build
